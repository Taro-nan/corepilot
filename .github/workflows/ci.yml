name: CorePilot CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
            browser: false
          - os: ubuntu-latest
            node: '24'
            browser: true
          - os: windows-latest
            node: '24'
            browser: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $chocoBin = Join-Path $env:ProgramData 'chocolatey\bin'
            $env:Path += ";$chocoBin"
            $chocoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          rg --version
      - run: rg --version
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:repo
      - run: npm test
      - name: Install Chromium and Linux dependencies
        if: matrix.browser && runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium
        if: matrix.browser && runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Select Playwright Chromium
        if: matrix.browser
        shell: bash
        run: echo "COREPILOT_BROWSER_PATH=$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Web integration tests
        if: matrix.browser
        run: npm run test:web
      - name: Upload failed browser diagnostics
        if: failure() && matrix.browser
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ runner.os }}-node-${{ matrix.node }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
