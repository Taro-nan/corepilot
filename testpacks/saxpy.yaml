      library: OpenBLAS
      version: 0.3.33
      sha256: 6c5246e4c2aee253064a5b5e25b8292faacb8147c824c136606d76dad00c9257
      path: /home/chenmn/phyopt-runner/workspace/control-plane-e2e-20260929-01/baselines/openblas-release033/0.3.33/6c5246e4c2aee253064a5b5e25b8292faacb8147c824c136606d76dad00c9257/artifact.so
  thresholds:
    weighted_geomean_min: 1.01
    overall_ci_lower_min: 1.0
