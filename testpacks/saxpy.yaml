# Second-domain onboarding profile. The evaluator is intentionally
# QUALIFICATION_PENDING and RPC formal preflight must reject it until a real
# S5000C target run and explicit owner approval are complete.
schema_version: 1
testpack_id: saxpy-s5000c-draft
function_name: cblas_saxpy
function_family: axpy
operation: y=alpha*x+y
data_type: float32

