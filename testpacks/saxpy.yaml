    - { case_id: incy3, parameters: { n: 33, incx: 1, incy: 3, alpha: 1.25, seed: 105 }, threads: 1, critical: true, weight: 1 }
    - { case_id: alpha_zero, parameters: { n: 64, incx: 1, incy: 1, alpha: 0, seed: 106 }, threads: 1, critical: true, weight: 1 }
