    - { case_id: saxpy_1048576_t1, parameters: { n: 1048576, incx: 1, incy: 1, alpha: 0.75, loops: 80, seed: 1003 }, threads: 1, critical: true, weight: 2 }
    - { case_id: saxpy_1048576_incx2_t1, parameters: { n: 1048576, incx: 2, incy: 1, alpha: -0.5, loops: 50, seed: 1004 }, threads: 1, critical: true, weight: 1 }
  sampling:
    warmup: 1
    samples: 3
    interleave_seed: 20260930
    bootstrap_iterations: 10000
  baselines:
    current:
      id: phyblas-source-baseline-5e55d5419
      library: PhyBLAS
      version: 5e55d54192e3f9b9c876f989b78a43e937ad670d
      sha256: 48add03e5f2339d7a187a59fec957f5a1a81441df2fe2a4ac1b8ca3554fd0b3a
